name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

env:
  NT_API_TAG: v1.18.0   # firmware 1.18 = plug-in API v13

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Arm toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libstdc++-arm-none-eabi-newlib

      - name: Fetch Disting NT API
        run: git clone --depth 1 --branch "$NT_API_TAG" https://github.com/expertsleepersltd/distingNT_API.git

      - name: Host tests
        run: make test

      - name: Build plug-in
        run: make NT_API=distingNT_API

      - uses: actions/upload-artifact@v4
        with:
          name: metronomicon.o
          path: plugins/metronomicon.o

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: plugins/metronomicon.o
