name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

env:
  NT_API_TAG: v1.18.0   # firmware 1.18 = plug-in API v13

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Arm toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libstdc++-arm-none-eabi-newlib

      - name: Fetch Disting NT API
        run: git clone --depth 1 --branch "$NT_API_TAG" https://github.com/expertsleepersltd/distingNT_API.git

      - name: Check repository layout
        # Source files uploaded to the wrong folder would silently build old code.
        run: |
          stray=$(ls *.cpp *.h test_engine.cpp gen_patterns.py build.yml 2>/dev/null || true)
          if [ -n "$stray" ]; then
            echo "::error::These files belong in src/, tests/, tools/ or .github/workflows/, not the repo root: $stray"
            exit 1
          fi
          grep -q 'METRONOMICON_VERSION "' src/metronome.cpp
          echo "Building Metronomicon $(grep -o 'METRONOMICON_VERSION "[^"]*"' src/metronome.cpp | cut -d'"' -f2)"

      - name: Host tests
        run: make test

      - name: Build plug-in
        run: make NT_API=distingNT_API

      - uses: actions/upload-artifact@v4
        with:
          name: metronomicon.o
          path: plugins/metronomicon.o

      - name: Release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="$ver" '$0 == "## " v {on=1; next} /^## / && on {exit} on' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then echo "::error::CHANGELOG.md has no '## $ver' section"; exit 1; fi
          grep -q "METRONOMICON_VERSION \"$ver\"" src/metronome.cpp || { echo "::error::src/metronome.cpp version does not match tag $GITHUB_REF_NAME"; exit 1; }
          cat release_notes.md

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Metronomicon ${{ github.ref_name }}
          body_path: release_notes.md
          files: plugins/metronomicon.o
